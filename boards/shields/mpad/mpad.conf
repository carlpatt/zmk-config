# --- Rotary Encoder ---
# Enable the encoder
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- Power Management (Crucial for Wireless) ---
# Enable deep sleep state
CONFIG_ZMK_SLEEP=y
# Time in milliseconds before entering deep sleep (15 minutes)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- LED Underglow Config ---
# Enable RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
# Set the driver to WS2812/SK6803 protocol
CONFIG_WS2812_STRIP=y

# Turn off LEDs automatically when the keyboard goes idle (1 minute)
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# --- External Power Routing ---
# Enable the external power cutoff switch
CONFIG_ZMK_EXT_POWER=y
# IMPORTANT: DO NOT cut VCC power when turning off underglow (prevents encoders from dying)
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Enable the widget & layer colors
CONFIG_SMART_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=n

# 2. Turn ON the blinking indicator mode
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=y

# 3. Choose your flash color (1=Red, 2=Green, 3=Yellow, 4=Blue, 6=Cyan)
CONFIG_RGBLED_WIDGET_LAYER_COLOR=1
