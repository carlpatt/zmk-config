# --- Rotary Encoder ---
# Enable the encoder
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- Power Management (Crucial for Wireless) ---
# Enable deep sleep state
CONFIG_ZMK_SLEEP=y
# Time in milliseconds before entering deep sleep (15 minutes)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- LED Underglow Config ---
# Enable RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=2
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=40
CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=2
CONFIG_ZMK_RGB_UNDERGLOW_SAT_STEP=5
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=5
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=80
# Enable the WS2812/SK6803 LED strip driver (gates the SPI driver backend).
# Without this the worldsemi,ws2812-spi node has no driver and the build fails
# to link (undefined __device_dts_ord_N in rgb_underglow.c).
CONFIG_WS2812_STRIP=y

# Turn off LEDs automatically when the keyboard goes idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_IDLE_TIMEOUT=600000

# --- External Power Routing ---
# The battery cutoff is a hard series switch (no GPIO), so it needs no ZMK
# driver. Do NOT enable CONFIG_ZMK_EXT_POWER here: on the SuperMini it drives
# P0.13 (the VCC rail that powers the LED strip), and with CONFIG_SETTINGS it
# restores a saved "off" state at boot, cutting the rail so the LEDs never
# light. In-tree SuperMini underglow shields leave it off.
# CONFIG_ZMK_EXT_POWER default is y (Kconfig.defaults) — override it explicitly.
CONFIG_ZMK_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# --- Enable Mouse For Horozontal Scroll ---
CONFIG_ZMK_POINTING=y

# --- ZMK Studio (web config UI over USB) ---
CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_SETTINGS_RESET_ON_START=y

CONFIG_UART_CONSOLE=n
