manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    # Custom behavior module (3-state layer + underglow color toggle),
    # distributed as its own repo (same pattern as zmk-leader-key). path keeps
    # the checkout out of the workspace root so it doesn't break ZMK shield
    # discovery.
    - name: mpad-layer-ug
      url: https://github.com/carlpatt/zmk-layer-ug
      revision: main
      path: modules/mpad-layer-ug
  self:
    path: config
