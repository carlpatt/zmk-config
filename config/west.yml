manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    # Custom behavior module (3-state layer + underglow color toggle).
    # Local project: path is relative to the manifest (config/).
    - name: mpad-layer-ug
      path: ../modules/layer-ug
  self:
    path: config
